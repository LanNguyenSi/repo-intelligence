version: 2
updates:
  # Keeps the devreview Dockerfile's node:22-alpine base image digest
  # current. The digest is pinned in the Dockerfile itself (tag in front
  # of the digest). Without the ignore rule below, Dependabot would pick
  # the highest comparable N-alpine tag and propose a Node major bump
  # instead of refreshing the 22-alpine digest. With major updates
  # ignored, 22-alpine stays the latest candidate and Dependabot opens a
  # digest refresh PR when that tag moves; the PR touches the Dockerfile,
  # so it runs devreview-docker.yml through its packages/devreview/**
  # path filter. Node major upgrades are done by hand.
  - package-ecosystem: docker
    directory: /packages/devreview
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

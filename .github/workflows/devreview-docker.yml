name: DevReview Docker

# Builds the devreview package's Docker image and smoke-checks it. No
# workflow in this repo previously exercised the Dockerfile, so a
# build-config drift (build script vs. Dockerfile COPY list) stayed
# green through CI and was only caught in review. This job is
# path-filtered to the devreview package (plus its own workflow file,
# so an edit to the job itself is checked too) since the Dockerfile's
# build context copies only files inside packages/devreview: no
# root-level file is part of the image build here. No image is pushed.
#
# The Dockerfile's node:22-alpine base is pinned by digest (tag in
# front of the digest) instead of floating, so an upstream base image
# change cannot silently break the build or the /health smoke between
# devreview PRs. .github/dependabot.yml watches that pinned digest
# (docker ecosystem, packages/devreview, Node major updates ignored so
# 22-alpine stays the update target) and opens a PR when a new digest
# is published for the tag; Node major upgrades are done by hand. That
# PR touches the Dockerfile, so it runs this same job through the path
# filter above and a human reviews the result before merge. A weekly schedule trigger was
# considered instead, but it only runs on the default branch, a
# scheduled failure notifies only the workflow's last editor, and
# nobody watches it run; the digest-pin PR route turns drift into a
# reviewed, path-filtered CI run instead of an unattended one.

on:
  push:
    branches: [master]
    paths:
      - packages/devreview/**
      - .github/workflows/devreview-docker.yml
  pull_request:
    branches: [master]
    paths:
      - packages/devreview/**
      - .github/workflows/devreview-docker.yml

permissions:
  contents: read

concurrency:
  group: devreview-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/devreview
    env:
      IMAGE_TAG: devreview-ci:${{ github.run_id }}
      CONTAINER_NAME: devreview-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE_TAG" .

      - name: Start container
        run: |
          docker run -d --name "$CONTAINER_NAME" -p 3000:3000 \
            -e GITHUB_TOKEN=dummy-token \
            -e WEBHOOK_SECRET=dummy-secret \
            "$IMAGE_TAG"

      - name: Smoke check GET /health
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /tmp/devreview-health.json; then
              break
            fi
            sleep 1
          done
          echo "response:"
          cat /tmp/devreview-health.json
          echo
          jq -e '.status == "ok"' /tmp/devreview-health.json > /dev/null

      - name: Container logs
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Clean up container and image
        if: always()
        run: |
          docker rm -f "$CONTAINER_NAME" || true
          docker rmi -f "$IMAGE_TAG" || true
